<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Linen Shirt — Summer Linen Store</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org/",
    "@type": "Product",
    "name": "Classic Linen Shirt",
    "image": "foto.jpeg",
    "description": "Lightweight, breathable 100% linen shirt with a relaxed, timeless fit.",
    "sku": "SKU-123",
    "offers": {
      "@type": "Offer",
      "priceCurrency": "USD",
      "price": "24.99",
      "availability": "https://schema.org/InStock"
    }
  }
  </script>
  <style>
    :root {
      --primary: #2b4c3f;
      --primary-hover: #1f372d;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --text-muted: #6c757d;
      --badge-bg: #e6f4ea;
      --badge-color: #137333;
      --border: #e9ecef;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 640px) {
      .product-card {
        grid-template-columns: 1fr;
      }
    }

    .product-media {
      background-color: #f1f3f5;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }

    .product-details {
      padding: 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .sku {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background-color: var(--badge-bg);
      color: var(--badge-color);
    }

    .product-title {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .product-price {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 1rem;
    }

    .product-description {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
    }

    .btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 0.85rem 1.25rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Summer Linen Store</h1>
      <p>Simple, breathable, and timeless essentials</p>
    </header>

    <main>
      <article class="product-card">
        <div class="product-media">
          <img src="foto.jpeg" alt="Classic Linen Shirt">
        </div>
        <div class="product-details">
          <div class="product-header">
            <span class="sku">SKU-123</span>
            <span class="badge">In Stock</span>
          </div>
          <h2 class="product-title">Classic Linen Shirt</h2>
          <div class="product-price">24.99 USD</div>
          <p class="product-description">
            Lightweight, breathable 100% linen shirt with a relaxed, timeless fit for warm days.
          </p>
          <button class="btn" type="button">Add to Cart</button>
        </div>
      </article>
    </main>
  </div>

</body>
</html>
